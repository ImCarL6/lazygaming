name: Build e testes
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-dev.txt
      - run: node scripts/Auditar-Git.mjs
      - run: python scripts/Obter-Motor.py
      - run: ./scripts/Testar.ps1
        shell: pwsh
      - name: Verificar publicação PC sem instalar
        run: ./scripts/Publicar-PC.ps1
        shell: pwsh
      - run: node scripts/Verificar-PC.mjs
      - name: Preparar interface TV sem assinatura
        run: ./scripts/Empacotar-TV.ps1 -StageOnly
        shell: pwsh
